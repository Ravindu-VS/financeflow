apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-backend
  namespace: finai-enterprise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-backend
  template:
    metadata:
      labels:
        app: ai-backend
    spec:
      containers:
        - name: ai-backend
          image: finai-ai-backend:latest
          imagePullPolicy: Never # Adjust if using an external registry
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: finai-config
            - secretRef:
                name: finai-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-backend
  namespace: finai-enterprise
spec:
  ports:
    - port: 8000
  selector:
    app: ai-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: finai-enterprise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: finai-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: AI_BACKEND_URL
              value: "http://ai-backend:8000"
            - name: REDIS_URL
              value: "redis://redis:6379"
          envFrom:
            - secretRef:
                name: finai-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: finai-enterprise
spec:
  ports:
    - port: 8080
  selector:
    app: gateway
